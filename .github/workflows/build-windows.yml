name: Build Windows Desktop App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust Stable (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Ensure Offline Resource Directory Exists
        shell: bash
        run: |
          mkdir -p src-tauri/resources/models
          if [ ! -f src-tauri/resources/models/README.md ]; then
            echo "Veritas Forensic Offline Weights" > src-tauri/resources/models/README.md
          fi

      - name: Build Frontend
        run: npm run build

      - name: Pre-download NSIS dependencies
        shell: bash
        run: |
          mkdir -p "$LOCALAPPDATA/tauri/NSIS"
          curl -f -L --retry 5 --retry-delay 2 "https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.13/nsis-3.13.zip" -o "$TEMP/nsis.zip"
          unzip -q -o "$TEMP/nsis.zip" -d "$LOCALAPPDATA/tauri/NSIS"
          curl -f -L --retry 5 --retry-delay 2 "https://github.com/tauri-apps/nsis-tauri-utils/releases/download/nsis_tauri_utils-v0.5.3/nsis_tauri_utils.dll" -o "$LOCALAPPDATA/tauri/NSIS/Plugins/x86-unicode/nsis_tauri_utils.dll" || true

      - name: Build Tauri Desktop Bundle
        shell: bash
        run: |
          npm run tauri build -- --bundles nsis,msi

      - name: Upload Windows Installers
        uses: actions/upload-artifact@v4
        with:
          name: veritas-forensic-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
